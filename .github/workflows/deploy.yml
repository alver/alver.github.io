name: Deploy to GitHub Pages

# Plain static site — no build step. Publishes the contents of public/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # public/ becomes the site root, so public/CNAME lands at /CNAME.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub's Pages backend intermittently rejects deployments with
      # "Deployment failed, try again later" — retry up to 3 times with backoff.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      # Final attempt without continue-on-error: three failures fail the job.
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
